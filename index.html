<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ Đồ Lớp Học - Quản Lý Vi Phạm</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; text-align: center; }

        .header h1 { margin: 0 0 5px 0; color: #1565c0; font-size: 24px; }
        .header p { margin: 0 0 15px 0; color: #555; font-size: 14px; }

        .classroom-container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .seating-area { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .column { display: flex; flex-direction: column; gap: 10px; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #e9ecef; }
        .column-title { font-weight: bold; color: #1976d2; font-size: 13px; padding-bottom: 5px; border-bottom: 2px solid #1976d2; margin-bottom: 5px; }
        .desk { display: flex; gap: 6px; background: #e3f2fd; padding: 6px; border-radius: 6px; border: 1px solid #bbdefb; }

        .seat {
            flex: 1; background: #ffffff; border: 1px solid #90caf9; border-radius: 4px;
            padding: 8px 2px; font-size: 12px; font-weight: 600; color: #2c3e50;
            cursor: grab; transition: all 0.2s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            min-height: 38px; display: flex; align-items: center; justify-content: center;
            user-select: none;
        }
        .seat:active { cursor: grabbing; }
        .seat:hover { background-color: #1976d2; color: #ffffff; }
        .seat.empty { color: #aaa; font-weight: normal; font-style: italic; background: #fafafa; }
        .seat.drag-over { border: 2px dashed #e53935; background-color: #ffebee !important; color: #c62828; }

        /* BẢNG VÀ BÀN GIÁO VIÊN */
        .front-area { margin-top: 10px; border-top: 2px dashed #ccc; padding-top: 20px; }
        .entrance { text-align: left; font-weight: bold; color: #d32f2f; margin-bottom: 15px; font-size: 14px; }
        .teacher-board-row { display: flex; gap: 15px; align-items: center; }
        .board { flex: 3; background-color: #2e7d32; color: white; padding: 12px; border-radius: 6px; font-weight: bold; letter-spacing: 2px; }
        .teacher-desk { flex: 1; background-color: #8d6e63; color: white; padding: 12px; border-radius: 6px; font-weight: bold; }

        /* POPUP MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px 25px; border-radius: 10px; width: 90%; max-width: 420px; text-align: left; position: relative; }
        .close-btn { position: absolute; top: 12px; right: 15px; font-size: 22px; cursor: pointer; color: #999; }
        .violation-card { background: #fff5f5; border-left: 4px solid #e53935; padding: 8px 12px; margin-top: 8px; border-radius: 0 4px 4px 0; }
        .violation-date { font-weight: bold; color: #c62828; font-size: 0.85em; }
        .violation-text { color: #333; font-size: 0.9em; margin-top: 2px; }
        .loading { color: #1976d2; font-weight: bold; margin-bottom: 15px; }

        /* Nút Chuông Float */
        .bell-btn {
            position: fixed; top: 20px; right: 20px; background: #ffffff;
            border: 2px solid #1565c0; border-radius: 50%; width: 48px; height: 48px;
            font-size: 22px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s; z-index: 999; display: flex; align-items: center; justify-content: center;
        }
        .bell-btn:hover { transform: scale(1.1); background-color: #e3f2fd; }
        .bell-badge {
            position: absolute; top: -5px; right: -5px; background-color: #e53935;
            color: white; border-radius: 50%; padding: 2px 6px; font-size: 11px; font-weight: bold;
        }

        /* Giao diện Bảng Tóm Tắt Trong Modal */
        .summary-modal-content { max-width: 650px !important; }
        .summary-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .summary-table th, .summary-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .summary-table th { background-color: #1976d2; color: white; position: sticky; top: 0; }
        .summary-table tr:nth-child(even) { background-color: #f9f9f9; }
        .badge-count { background: #ffebee; color: #c62828; font-weight: bold; padding: 3px 8px; border-radius: 12px; }
        .total-summary-badge { background: #e3f2fd; color: #1565c0; font-size: 13px; font-weight: bold; padding: 6px 12px; border-radius: 6px; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>SƠ ĐỒ LỚP HỌC</h1>
        <p id="statusText" class="loading">⏳ Đang tải dữ liệu từ Google Sheet...</p>
    </div>

    <div class="classroom-container">
        <div class="seating-area" id="seatingArea"></div>

        <div class="front-area">
            <div class="entrance">🚪 Lối vào</div>
            <div class="teacher-board-row">
                <div class="board">BẢNG ĐEN</div>
                <div class="teacher-desk">BÀN GIÁO VIÊN</div>
            </div>
        </div>
    </div>

    <!-- Nút Chuông Thông Báo -->
    <button class="bell-btn" onclick="openSummaryModal()" title="Xem vi phạm tuần này">
        🔔
        <span class="bell-badge" id="violationCountBadge">0</span>
    </button>

    <!-- POPUP BẢNG TÓM TẮT VI PHẠM TUẦN HIỆN TẠI -->
    <div id="summaryModal" class="modal">
        <div class="modal-content summary-modal-content">
            <span class="close-btn" onclick="closeSummaryModal()">&times;</span>
            <h2 style="margin: 0 0 5px 0; color: #c62828; font-size: 20px;">📋 TÓM TẮT LỖI VI PHẠM TUẦN NÀY</h2>
            <div class="total-summary-badge" id="weekRangeText">Tuần hiện tại</div>
            
            <div style="max-height: 400px; overflow-y: auto;">
                <table class="summary-table">
                    <thead>
                        <tr>
                            <th style="width: 50px; text-align: center;">STT</th>
                            <th style="width: 150px;">Họ và Tên</th>
                            <th style="width: 90px; text-align: center;">Lỗi tuần này</th>
                            <th>Chi tiết vi phạm</th>
                        </tr>
                    </thead>
                    <tbody id="summaryTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- POPUP MODAL XEM CHI TIẾT HỌC SINH -->
    <div id="infoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="studentName" style="margin: 0 0 5px 0; color: #1565c0;"></h3>
            <p id="studentPhone" style="margin: 0 0 5px 0; font-size: 12px; color: #666;"></p>
            <p id="studentTotalViolations" style="margin: 0 0 10px 0; font-size: 13px; font-weight: bold; color: #d32f2f;"></p>
            <hr style="border: 0; border-top: 1px solid #eee;">
            <p style="margin: 10px 0 5px 0; font-weight: bold; color: #555; font-size: 14px;">Lịch sử vi phạm chi tiết:</p>
            <div id="violationLogs"></div>
        </div>
    </div>

    <script>
        const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwtQGkmPXZsdpvnRTpeoXquFqhOxn4nbHOaNX9MXoiwVPPZhyBFmXZ24PRj_VVB-ijPdA/exec";
        const TEACHER_PASSWORD = "7512240"; // 🔐 Mật khẩu xác nhận dành cho giáo viên (Có thể tự đổi)

        let studentDataStore = {};
        let draggedSeatIndex = null;

        function parseDate(dateString) {
            if (!dateString) return null;
            if (dateString instanceof Date) return dateString;
            const str = dateString.toString().trim();
            if (str.includes('T')) {
                const datePart = str.split('T')[0];
                const parts = datePart.split('-');
                if (parts.length === 3) return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
            }
            if (str.includes('/')) {
                const datePart = str.split(' ')[0];
                const parts = datePart.split('/');
                if (parts.length === 3) return new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
            }
            if (str.includes('-')) {
                const parts = str.split('-');
                if (parts.length === 3) return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
            }
            const parsed = new Date(str);
            return isNaN(parsed.getTime()) ? null : parsed;
        }

        function formatDateString(dateStr) {
            const d = parseDate(dateStr);
            if (!d) return dateStr || 'Không ghi';
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            return `${day}/${month}/${d.getFullYear()}`;
        }

        function isDateInCurrentWeek(dateString) {
            const date = parseDate(dateString);
            if (!date) return false;
            const today = new Date();
            date.setHours(0, 0, 0, 0);
            today.setHours(0, 0, 0, 0);
            const day = today.getDay();
            const monday = new Date(today);
            monday.setDate(today.getDate() - (day === 0 ? 6 : day - 1));
            monday.setHours(0, 0, 0, 0);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            sunday.setHours(23, 59, 59, 999);
            return date >= monday && date <= sunday;
        }

        // Khởi tạo 48 bàn + sự kiện Drag & Drop
        function initSeating() {
            const seatingArea = document.getElementById('seatingArea');
            seatingArea.innerHTML = '';

            for (let day = 1; day <= 4; day++) {
                const col = document.createElement('div');
                col.className = 'column';
                col.innerHTML = `<div class="column-title">DÃY ${day}</div>`;

                for (let ban = 1; ban <= 6; ban++) {
                    const desk = document.createElement('div');
                    desk.className = 'desk';

                    for (let seatNum = 1; seatNum <= 2; seatNum++) {
                        const seatIndex = (day - 1) * 12 + (ban - 1) * 2 + seatNum;
                        const seat = document.createElement('div');
                        seat.className = 'seat empty';
                        seat.id = `seat-${seatIndex}`;
                        seat.dataset.seatIndex = seatIndex;
                        seat.innerText = `Chỗ ${seatIndex}`;
                        seat.draggable = true;

                        // Sự kiện Drag & Drop
                        seat.addEventListener('dragstart', handleDragStart);
                        seat.addEventListener('dragover', handleDragOver);
                        seat.addEventListener('dragleave', handleDragLeave);
                        seat.addEventListener('drop', handleDrop);

                        desk.appendChild(seat);
                    }
                    col.appendChild(desk);
                }
                seatingArea.appendChild(col);
            }
        }

        // Xử lý logic Drag & Drop
        function handleDragStart(e) {
            draggedSeatIndex = parseInt(this.dataset.seatIndex);
            e.dataTransfer.setData('text/plain', draggedSeatIndex);
        }

        function handleDragOver(e) {
            e.preventDefault();
            this.classList.add('drag-over');
        }

        function handleDragLeave() {
            this.classList.remove('drag-over');
        }

        async function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            const targetSeatIndex = parseInt(this.dataset.seatIndex);

            if (draggedSeatIndex === targetSeatIndex) return;

            // Tìm học sinh ở 2 vị trí
            const studentA = Object.values(studentDataStore).find(s => s.viTri === draggedSeatIndex);
            const studentB = Object.values(studentDataStore).find(s => s.viTri === targetSeatIndex);

            if (!studentA && !studentB) return; // Cả 2 bàn đều trống

            const nameA = studentA ? studentA.fullName : "Chỗ trống";
            const nameB = studentB ? studentB.fullName : "Chỗ trống";

            // Yêu cầu mật khẩu từ Giáo viên
            const pwd = prompt(`🔐 XÁC NHẬN ĐỔI CHỖ:\nBạn có muốn đổi vị trí giữa:\n- ${nameA} (Vị trí ${draggedSeatIndex})\n- ${nameB} (Vị trí ${targetSeatIndex})\n\nNhập mật khẩu Giáo viên để thực hiện:`);

            if (pwd === null) return; // Nhấn Hủy

            if (pwd !== TEACHER_PASSWORD) {
                alert("❌ Mật khẩu không chính xác! Không thể thay đổi vị trí.");
                return;
            }

            // Tiến hành cập nhật vị trí
            const updates = [];
            if (studentA) {
                studentA.viTri = targetSeatIndex;
                updates.push({ stt: studentA.stt, viTri: targetSeatIndex });
            }
            if (studentB) {
                studentB.viTri = draggedSeatIndex;
                updates.push({ stt: studentB.stt, viTri: draggedSeatIndex });
            }

            // Render lại giao diện web
            renderSeats();

            // Gửi dữ liệu cập nhật về Google Sheet
            document.getElementById('statusText').innerText = "⏳ Đang lưu vị trí mới lên Google Sheet...";
            document.getElementById('statusText').style.color = "#1565c0";

            try {
                const res = await fetch(GOOGLE_SHEET_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "updateSeats", updates: updates })
                });
                document.getElementById('statusText').innerText = "✅ Đã cập nhật vị trí mới thành công!";
                document.getElementById('statusText').style.color = "#2e7d32";
            } catch (err) {
                console.error("Lỗi cập nhật:", err);
                alert("❌ Không thể đồng bộ lên Google Sheet. Vui lòng kiểm tra lại kết nối!");
            }
        }

        function generateShortNames(fullNameList) {
            const shortNameMap = {};
            const groups = {};
            fullNameList.forEach(fullName => {
                const words = fullName.trim().split(/\s+/);
                const firstName = words[words.length - 1]; 
                if (!groups[firstName]) groups[firstName] = [];
                groups[firstName].push({ fullName, lastName: words[0], firstName });
            });
            for (let firstName in groups) {
                const list = groups[firstName];
                if (list.length === 1) {
                    shortNameMap[list[0].fullName] = firstName;
                } else {
                    list.forEach(item => { shortNameMap[item.fullName] = `${item.lastName} ${item.firstName}`; });
                }
            }
            return shortNameMap;
        }

        function renderSeats() {
            initSeating();
            const fullNameList = Object.values(studentDataStore).map(s => s.fullName);
            const shortNames = generateShortNames(fullNameList);

            for (let stt in studentDataStore) {
                const student = studentDataStore[stt];
                if (student.viTri && student.viTri >= 1 && student.viTri <= 48) {
                    const seatElem = document.getElementById(`seat-${student.viTri}`);
                    if (seatElem) {
                        seatElem.innerText = shortNames[student.fullName] || student.fullName;
                        seatElem.title = `STT ${student.stt}: ${student.fullName} (Kéo để đổi chỗ)`;
                        seatElem.classList.remove('empty');
                        seatElem.onclick = () => viewInfo(student.stt);
                    }
                }
            }
        }

        async function loadSheetData() {
            try {
                const response = await fetch(GOOGLE_SHEET_API_URL);
                const data = await response.json();
                studentDataStore = {};

                data.forEach(item => {
                    if (item.hoTen) {
                        const fullName = item.hoTen.trim();
                        let pos = item.viTri ? parseInt(item.viTri.toString().replace(/\D/g, '')) : null;
                        studentDataStore[item.stt] = {
                            stt: item.stt,
                            fullName: fullName,
                            viTri: pos,
                            sdt: item.sdt,
                            violations: item.violations || []
                        };
                    }
                });

                renderSeats();
                document.getElementById('statusText').innerText = "✅ Đã đồng bộ dữ liệu thành công!";
                document.getElementById('statusText').style.color = "#2e7d32";
            } catch (error) {
                console.error("Lỗi tải dữ liệu:", error);
                document.getElementById('statusText').innerText = "❌ Lỗi kết nối dữ liệu Google Sheet!";
                document.getElementById('statusText').style.color = "#d32f2f";
            }
            renderSummaryTable();
        }

        function viewInfo(stt) {
            const student = studentDataStore[stt];
            if (!student) return;

            document.getElementById('studentName').innerText = `[STT: ${student.stt}] ${student.fullName}`;
            document.getElementById('studentPhone').innerText = student.sdt ? `📞 SĐT PH: ${'0' + student.sdt}` : '📞 SĐT PH: Chưa có';
            
            const totalCount = student.violations ? student.violations.length : 0;
            document.getElementById('studentTotalViolations').innerText = `🚨 Tổng số lỗi đã mắc phải: ${totalCount} lỗi`;

            const container = document.getElementById('violationLogs');
            container.innerHTML = '';

            if (totalCount === 0) {
                container.innerHTML = '<p style="color: #2e7d32; font-size: 13px; font-weight: 500;">✨ Chưa vi phạm lỗi nào từ đầu năm.</p>';
            } else {
                student.violations.forEach(item => {
                    let cleanContent = (item.content || '').replace(/^Nội dung:\s*/i, '');
                    const card = document.createElement('div');
                    card.className = 'violation-card';
                    card.innerHTML = `
                        <div class="violation-date">📅 Ngày: ${formatDateString(item.date)}</div>
                        <div class="violation-text">⚠️ Nội dung: ${cleanContent}</div>
                    `;
                    container.appendChild(card);
                });
            }
            document.getElementById('infoModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('infoModal').style.display = 'none'; }

        function renderSummaryTable() {
            const tbody = document.getElementById('summaryTableBody');
            tbody.innerHTML = '';
            let weekViolationsCount = 0;
            let hasWeekViolations = false;

            for (let stt in studentDataStore) {
                const student = studentDataStore[stt];
                const currentWeekViolations = (student.violations || []).filter(v => isDateInCurrentWeek(v.date));

                if (currentWeekViolations.length > 0) {
                    hasWeekViolations = true;
                    weekViolationsCount += currentWeekViolations.length;
                    const row = document.createElement('tr');
                    const violationListHtml = currentWeekViolations.map(v => {
                        let cleanContent = (v.content || '').replace(/^Nội dung:\s*/i, '');
                        return `• <b>[${formatDateString(v.date)}]</b>: ${cleanContent}`;
                    }).join('<br>');

                    row.innerHTML = `
                        <td style="text-align: center; font-weight: bold;">${student.stt}</td>
                        <td><b>${student.fullName}</b></td>
                        <td style="text-align: center;"><span class="badge-count">${currentWeekViolations.length} lỗi</span></td>
                        <td>${violationListHtml}</td>
                    `;
                    tbody.appendChild(row);
                }
            }

            if (!hasWeekViolations) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #2e7d32; padding: 20px;">🎉 Xuất sắc! Tuần này chưa có học sinh nào vi phạm.</td></tr>`;
            }
            document.getElementById('violationCountBadge').innerText = weekViolationsCount;
        }

        function openSummaryModal() {
            renderSummaryTable();
            document.getElementById('summaryModal').style.display = 'flex';
        }

        function closeSummaryModal() { document.getElementById('summaryModal').style.display = 'none'; }

        window.onclick = function(event) {
            if (event.target === document.getElementById('summaryModal')) closeSummaryModal();
            if (event.target === document.getElementById('infoModal')) closeModal();
        };

        loadSheetData();
    </script>
</body>
</html>
